<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <!-- Light mode logo: Dark ink wordmark, green symbol -->
  <g transform="translate(20, 20)">
    <!-- Wordmark "اعتماد" -->
    <text x="330" y="90" font-family="'Noto Kufi Arabic', Arial, sans-serif" font-size="80" font-weight="800" fill="#17202A" text-anchor="end" letter-spacing="-2">اعتماد</text>

    <!-- Symbol (Gateway + Checkmark) -->
    <g transform="translate(350, 0)">
      <!-- Left pillar & arch -->
      <path d="M 0,100 L 0,40 C 0,20 20,5 40,0 L 50,10 L 25,35 C 20,40 20,45 20,50 L 20,100 Z" fill="#007A3D" />
      <!-- Right pillar -->
      <path d="M 80,100 L 80,60 L 100,40 L 100,100 Z" fill="#007A3D" />
      <!-- Checkmark -->
      <path d="M 20,60 L 40,80 L 95,25 L 80,10 L 40,50 L 30,40 Z" fill="#007A3D" />
    </g>
  </g>
</svg>
